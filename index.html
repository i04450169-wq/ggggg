<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إسلام سامح | مطور بايثون & مصمم</title>
<style>
:root{--bg:#0b0f14;--card:#131a22;--green:#00e5a0;--text:#e6edf3;--muted:#8b98a5;--border:#1f2a35}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.container{max-width:950px;margin:auto;padding:0 20px}
.nav{position:fixed;top:0;left:0;right:0;background:rgba(11,15,20,.9);border-bottom:1px solid var(--border);z-index:999;padding:0 20px}
.nav-inner{max-width:950px;margin:auto;display:flex;justify-content:space-between;align-items:center;height:60px}
.nav a{color:var(--text);text-decoration:none;margin:0 12px;font-size:14px}
.nav a:hover{color:var(--green)}
.logo{color:var(--green);font-weight:bold}
header{text-align:center;padding:140px 20px 60px}
.badge{display:inline-block;color:var(--green);border:1px solid var(--green);padding:5px 18px;border-radius:20px;font-size:14px;margin-bottom:20px}
h1{font-size:48px;margin-bottom:10px}
.tagline{color:var(--muted);font-size:20px}
.btn{display:inline-block;background:var(--green);color:#0b0f14;padding:13px 30px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:30px;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
section{padding:60px 20px}
h2{font-size:28px;color:var(--green);text-align:center;margin-bottom:40px;position:relative}
h2::after{content:'';display:block;width:60px;height:3px;background:var(--green);margin:10px auto 0;border-radius:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:transform .2s}
.card:hover{transform:translateY(-4px);border-color:var(--green)}
.card h3{color:var(--green);margin-bottom:8px}
.card p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.skills{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.skill{background:var(--card);border:1px solid var(--border);padding:12px 24px;border-radius:10px;color:var(--green);font-weight:bold;transition:transform .2s}
.skill:hover{transform:scale(1.05);border-color:var(--green)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:40px;margin-top:40px;text-align:center}
.stat{flex:1;min-width:150px}
.stat .num{font-size:40px;color:var(--green);font-weight:bold}
.stat .lbl{color:var(--muted);font-size:14px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.avatar{width:100px;height:100px;border-radius:50%;border:3px solid var(--green);margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:40px;background:#1a2430}
.role{color:var(--muted);font-size:14px;margin-top:5px}
.btn-outline{display:inline-block;border:1px solid var(--green);color:var(--green);padding:8px 20px;border-radius:8px;text-decoration:none;font-size:14px;margin:5px}
.btn-outline:hover{background:var(--green);color:#0b0f14}
.contact-box{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px;max-width:450px;margin:auto}
footer{text-align:center;color:var(--muted);padding:40px 20px;border-top:1px solid var(--border);font-size:14px}
@media (max-width: 600px) {
  h1 {
    font-size: 32px;
  }
  .nav-inner {
    flex-wrap: wrap;
    height: auto;
    padding: 10px 0;
  }
}
</style>
</head>
<body>
