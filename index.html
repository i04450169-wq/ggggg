<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إسلام سامح — مطور بايثون & مصمم</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a22;
      --text: #e6edf3;
      --muted: #8b98a5;
      --green: #00e5a0;
      --border: #1f2a35;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    header { text-align: center; padding: 60px 0 40px; }
    .badge {
      display: inline-block;
      color: var(--green);
      border: 1px solid var(--green);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    h1 { font-size: 42px; margin-bottom: 10px; }
    .tagline { color: var(--muted); font-size: 18px; }
    .btn {
      display: inline-block;
      background: var(--green);
      color: #0b0f14;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 30px;
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    section { margin: 50px 0; }
    h2 { font-size: 26px; margin-bottom: 20px; color: var(--green); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h3 { margin-bottom: 8px; }
    .card p { color: var(--muted); }
    .skills { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
    }
    .contact a {
      color: var(--green);
      text-decoration: none;
      margin-left: 20px;
    }
    footer { text-align: center; color: var(--muted); padding: 40px 0 20px; font-size: 14px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
